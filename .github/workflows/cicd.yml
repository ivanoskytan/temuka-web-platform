name: Build and Deploy Temuka Web Platform to Azure

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Image via ACR
        run: |
          az acr build \
            --registry temukaacr \
            --resource-group temuka \
            --image temuka-web-platform:${{ github.sha }} \
            --image temuka-web-platform:latest \
            --build-arg REACT_APP_API_SERVICE="https://temuka-main-api.nicebush-b3e89bd2.centralindia.azurecontainerapps.io" \
            --build-arg REACT_APP_WEBSOCKET_SERVICE="wss://temuka-main-api.nicebush-b3e89bd2.centralindia.azurecontainerapps.io" \
            --build-arg REACT_APP_INSIGHT_SERVICE="https://temuka-insight.nicebush-b3e89bd2.centralindia.azurecontainerapps.io" \
            .

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: temuka-web-platform
          resourceGroup: mental-health-ugm-chatbot
          imageToDeploy: temukaacr.azurecr.io/temuka-web-platform:${{ github.sha }}